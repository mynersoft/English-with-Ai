name: Android APK Build and Release

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Choose Gradle Command
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          fi

          if [ ! -f app/google-services.json ]; then
            echo "::warning::Firebase config missing. Firebase features may not work."
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder-project",
              "storage_bucket": "placeholder-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.mahir.engai"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "placeholder-api-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure Backend URL
        env:
          BACKEND_BASE_URL_SECRET: ${{ secrets.BACKEND_BASE_URL }}
        run: |
          if [ -n "$BACKEND_BASE_URL_SECRET" ]; then
            echo "BACKEND_BASE_URL=$BACKEND_BASE_URL_SECRET" > .env
          fi

      - name: Build Debug APK
        run: |
          $GRADLE_CMD assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EnglishAI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Signed Release APK
        id: release_build
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && \
             [ -n "$STORE_PASSWORD" ] && \
             [ -n "$KEY_PASSWORD" ]; then

            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d \
              > "${{ github.workspace }}/my-upload-key.jks"

            export KEYSTORE_PATH="${{ github.workspace }}/my-upload-key.jks"
            export STORE_PASSWORD
            export KEY_PASSWORD

            $GRADLE_CMD assembleRelease --no-daemon --stacktrace

            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping signed Release APK: signing secrets missing."
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Release APK Artifact
        if: steps.release_build.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EnglishAI-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: build-apk

    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: EnglishAI-Debug-APK
          path: apks/debug

      - name: Download Release APK
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: EnglishAI-Release-APK
          path: apks/release

      - name: Prepare Release Files
        run: |
          mkdir -p release-files

          find apks -type f -name '*.apk' -exec cp {} release-files/ \;

          if [ -z "$(ls -A release-files)" ]; then
            echo "No APK files found!"
            exit 1
          fi

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: release-files/*.apk
