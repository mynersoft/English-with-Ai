
name: Generate Android Signing Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Existing Signing Key
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          if gh variable get KEYSTORE_INITIALIZED \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Signing key already initialized."
            exit 1
          fi

      - name: Generate Keystore
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p app

          keytool -genkeypair -v \
            -keystore app/upload-keystore.jks \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=English-with-Ai, OU=Mobile, O=MynerSoft, L=Madhupur, ST=Tangail, C=BD"

      - name: Save Keystore as GitHub Secret
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          set -euo pipefail
          KEYSTORE_BASE64="$(base64 -w 0 app/upload-keystore.jks)"

          gh secret set KEYSTORE_BASE64 \
            --body "$KEYSTORE_BASE64" \
            --repo "$GITHUB_REPOSITORY"

          gh variable set KEYSTORE_INITIALIZED \
            --body "true" \
            --repo "$GITHUB_REPOSITORY"

      - name: Encrypt Backup
        env:
          BACKUP_PASSWORD: ${{ secrets.KEYSTORE_BACKUP_PASSWORD }}
        run: |
          set -euo pipefail

          openssl enc -aes-256-cbc \
            -salt -pbkdf2 -iter 200000 \
            -in app/upload-keystore.jks \
            -out upload-keystore.jks.enc \
            -pass env:BACKUP_PASSWORD

          rm -f app/upload-keystore.jks

      - name: Upload Encrypted Backup
        uses: actions/upload-artifact@v4
        with:
          name: English-with-Ai-Keystore-Backup
          path: upload-keystore.jks.enc
          if-no-files-found: error
          retention-days: 90
